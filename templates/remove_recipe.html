{% extends "layout.html" %}

{% block title %}Delete recipe{% endblock %}

{% block content %}
  <h2>Delete recipe</h2>

  <p>
    <strong>Recipe:</strong>
    {{ recipe.title }}
  </p>

  <p>Are you sure you want to delete this recipe?</p>

  <form
    action="/remove_recipe/{{ recipe.id }}"
    method="post"
  >
    <input
      type="hidden"
      name="csrf_token"
      value="{{ session.csrf_token }}"
    >

    <input
      type="hidden"
      name="next_page"
      value="{{ next_page }}"
    >

    <button
      class="danger-action"
      type="submit"
      name="remove"
    >
      Delete recipe
    </button>

    <a href="/recipe/{{ recipe.id }}">Cancel</a>
  </form>
{% endblock %}
