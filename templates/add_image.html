{% extends "layout.html" %}

{% block title %}Add profile picture{% endblock %}

{% block content %}
  <h2>Add or change profile picture</h2>

  <form
    action="/add_image"
    method="post"
    enctype="multipart/form-data"
  >
    <input
      type="hidden"
      name="csrf_token"
      value="{{ session.csrf_token }}"
    >

    <p>
      <label for="image">Choose a JPEG image</label><br>
      <input
        id="image"
        name="image"
        type="file"
        accept="image/jpeg"
        required
      >
    </p>

    <button type="submit">Save profile picture</button>
  </form>

  <p>
    <a href="/user/{{ session.user_id }}">
      Return to your profile
    </a>
  </p>
{% endblock %}
